name: Build Examples

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/library.json', '**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: pip install -U platformio

      - name: Validate package metadata
        run: pio pkg pack && rm -f *.tar.gz

      - name: Build examples
        run: |
          pio ci examples/Example.ino --lib="." --board=esp32dev
          pio ci examples/WiFiDeviceExample.ino --lib="." --board=esp32dev
