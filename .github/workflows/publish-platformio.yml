name: Publish to PlatformIO Registry

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/library.json', '**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: pip install -U platformio

      - name: Verify library.json version matches Release tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          LIB_VERSION=$(python3 -c "import json; print(json.load(open('library.json'))['version'])")
          if [ "$TAG_VERSION" != "$LIB_VERSION" ]; then
            echo "Error: Release tag ($TAG_VERSION) does not match library.json version ($LIB_VERSION)"
            exit 1
          fi

      - name: Build examples (CI check)
        run: |
          pio ci examples/Example.ino --lib="." --board=esp32dev
          pio ci examples/WiFiDeviceExample.ino --lib="." --board=esp32dev

      - name: Publish package to PlatformIO Registry
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: pio pkg publish --non-interactive
